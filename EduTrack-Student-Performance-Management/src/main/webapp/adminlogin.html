<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/script.js"></script>

</head>
<body>
    <form action="admin" method="post" onsubmit="return validateForm()">
    <label for="uname">Username:</label>
    <input type="text" id="uname" name="uname" placeholder="Enter your Username"> <br>

    <label for="pass">Password:</label>
    <input type="password" id="pass" name="pass" placeholder="Enter your Password"> <br>
    <input type="submit" value="Login">
</form>
</body>
