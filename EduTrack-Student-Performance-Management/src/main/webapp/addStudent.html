<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js"> </script>
</head>
    
<body>
    <form action="addStudent" method="post" onsubmit="return validateForm()">
        Roll NO: <input type="text" name="roll" id="roll"> <br>
        Name: <input type="text" name="sname" id="sname"> <br>
        Course: <input type="text" name="course" id="course"> <br>
        Core Java: <input type="text" name="cj" id="cj"> <br>
        Advance Java : <input type="text" name="ajava" id="ajava"> <br>
        HTML: <input type="text" name="html" id="html"> <br>
        Database : <input type="text" name="db" id="db"> <br>
        C : <input type="text" name="c" id="c"><br>
        Javascript: <input type="text" name="js" id="js"><br>
        <button type="submit">Add Student</button>
    </form>
</body>
</html>
